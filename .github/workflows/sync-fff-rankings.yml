name: Synchronisation classements FFF

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5,11,17 * * *"

permissions:
  contents: read

concurrency:
  group: fff-ranking-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DATABASE_URL: ${{ secrets.FFF_SYNC_DATABASE_URL }}
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Générer Prisma
        run: npx prisma generate
      - name: Synchroniser les classements
        run: npx tsx scripts/sync-fff-rankings.ts
